version: '3.8'

services:
  terra-pulse-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - TERRA_PULSE_MODEL_PATH=backend/terra_pulse_model.onnx
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_API_ENDPOINT=${DIFY_API_ENDPOINT:-https://api.dify.ai/v1}
      - DIFY_WORKFLOW_ID=${DIFY_WORKFLOW_ID}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=3600
      - MAX_RETRIES=3
      - TIMEOUT_SECONDS=30
      - API_KEY_HEADER=X-API-Key
      - RATE_LIMIT_PER_MINUTE=60
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
      - ENFORCE_HTTPS=false
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    volumes:
      - ./backend/terra_pulse_model.onnx:/app/backend/terra_pulse_model.onnx:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data: